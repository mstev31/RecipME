<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipME — Personal Recipe Notebook</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#C2410C',    // Main buttons (Done, Turn into Recipe) & active input border
            cream: '#FBF7F2',      // Warm cream page background behind white recipe cards
            ink: '#1F2937',        // All main text
            muted: '#6B7280',      // Small text, field labels, hints, "Saved automatically"
            tagGreen: '#3F7D3A',   // Selected tag & difficulty chips, active filters
            danger: '#B91C1C'      // Delete button & "Are you sure?" warning modal
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="min-h-screen flex flex-col bg-cream text-ink">

  <!-- =======================================================================
       DEDICATED INITIAL LOGIN SCREEN (Shown first before entering RecipME)
       ======================================================================= -->
  <section id="login-screen" class="min-h-screen flex flex-col justify-between bg-cream px-4 py-8 sm:py-12">
    <div class="web-container flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white font-bold text-xl shadow-sm">
          R
        </div>
        <div>
          <span class="font-bold text-2xl tracking-tight text-ink block leading-none">RecipME</span>
          <span class="text-xs text-muted block mt-1">Personal Recipe Notebook</span>
        </div>
      </div>

      <button type="button" onclick="UI.toggleLargeText()" 
              class="px-3.5 py-2 rounded-xl border border-stone-300 bg-white/80 hover:bg-white text-sm font-medium text-ink min-h-[42px] flex items-center gap-1.5 transition"
              title="Make text larger for easier reading">
        <span class="font-bold text-base">Aa</span>
        <span class="hidden sm:inline">Larger text</span>
      </button>
    </div>

    <div class="my-auto py-8 flex items-center justify-center">
      <div class="w-full max-w-[460px] space-y-6">
        <div class="text-center space-y-2">
          <h1 class="text-heading !text-3xl sm:!text-4xl">Welcome to RecipME</h1>
          <p class="text-body text-muted">
            Your personal family recipe notebook and cooking idea keeper.
          </p>
        </div>

        <div class="bg-white/95 rounded-2xl p-6 sm:p-8 shadow-sm border border-stone-300/90 space-y-5">
          <!-- Primary One-Click Demo Day Login Prefill Button -->
          <button type="button" id="btn-landing-demo-login" class="btn-main w-full !min-h-[52px] !text-lg shadow-sm">
            Demo Day Login
          </button>

          <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-stone-300/80"></div>
            <span class="shrink mx-3 text-small">or sign in with email</span>
            <div class="flex-grow border-t border-stone-300/80"></div>
          </div>

          <!-- Credential Form (Prefilled when Demo Day Login is clicked; submits on Sign In) -->
          <form id="landing-login-form" onsubmit="UI.handleCredentialLogin(event)" class="space-y-4">
            <div>
              <label for="landing-login-email" class="text-small block mb-1">Email</label>
              <input type="email" id="landing-login-email" class="recipme-input" placeholder="demoday@recipme.app" required>
            </div>
            <div>
              <label for="landing-login-password" class="text-small block mb-1">Password</label>
              <input type="password" id="landing-login-password" class="recipme-input" placeholder="••••••••••••
